services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: clinic
      MONGO_INITDB_ROOT_PASSWORD: clinic-dev-password
      MONGO_INITDB_DATABASE: clinicmanagement
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
